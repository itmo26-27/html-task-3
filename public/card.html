<article class="news-card" id="news-{{id}}" data-news-id="{{id}}">
  <div class="card-kicker"><span>{{category}}</span><span class="card-number">№ {{number}}</span></div>
  <h3 class="card-title">{{title}}</h3>
  <p class="story-summary"><span class="summary-lead">{{lead}}</span> <span class="summary-details">{{details}}</span> <span class="summary-ending">{{ending}}</span></p>
  <div class="card-meta"><time>{{date}}</time><span>{{minutes}} минут чтения</span></div>
  <a class="story-link" href="#news-{{id}}">К материалу <span aria-hidden="true">↗</span></a>
</article>
